services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/cloud
      JWT_SECRET: ${JWT_SECRET:-please-change-me-please-change-me-please-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8443,http://localhost:5173}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-log}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      RUN_WORKER: "true"
    ports:
      - "3000:3000"

volumes:
  pgdata:
